<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco de Prompts - Tito Aponte</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS CDN (Librería oficial para leer/escribir Excel) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- FontAwesome CDN para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .strict-three-lines {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            height: 4.5rem;
            max-height: 4.5rem;
            line-height: 1.5rem;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen font-sans antialiased">

    <!-- Header Estilo Windows / Claro -->
    <header class="bg-white border-b border-slate-300 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-3">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2 rounded-lg text-white shadow-sm">
                    <i class="fa-solid fa-brain text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-slate-900">Banco de Prompts</h1>
                    <p class="text-[11px] text-slate-500">Tito Aponte • Total: <span id="headerTotalPrompts">0</span></p>
                </div>
            </div>

            <!-- Botones de Acción Global -->
            <div class="flex flex-wrap items-center gap-2">
                <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-md text-xs font-medium transition shadow-sm flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-plus"></i> Nuevo
                </button>
                
                <!-- Cargar Excel -->
                <button onclick="triggerFileSelect()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-md text-xs font-medium transition shadow-sm flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-file-excel"></i> Cargar Excel
                </button>
                <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleFileUpload(event)">

                <button onclick="openBulkModal()" class="bg-violet-600 hover:bg-violet-700 text-white px-3 py-1.5 rounded-md text-xs font-medium transition shadow-sm flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-paste"></i> Masivo
                </button>

                <button onclick="exportToExcel()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-2.5 py-1.5 rounded-md text-xs transition flex items-center gap-1 cursor-pointer" title="Exportar a Excel">
                    <i class="fa-solid fa-download"></i>
                </button>

                <!-- Borrado Protegido (Clave 3501) -->
                <button onclick="promptClearAll()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 px-2.5 py-1.5 rounded-md text-xs transition flex items-center gap-1 cursor-pointer" title="Borrar todo con clave">
                    <i class="fa-solid fa-trash-can"></i> Borrar Todo
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-4">
        
        <!-- Barra de Búsqueda y Filtros -->
        <div class="bg-white border border-slate-300 p-3 rounded-lg shadow-sm mb-4 flex flex-col md:flex-row gap-3 items-center justify-between">
            <div class="relative w-full md:w-80">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                <input type="text" id="searchInput" placeholder="Buscar prompt..." oninput="filterPrompts()" 
                    class="w-full bg-slate-50 border border-slate-300 rounded-md pl-9 pr-3 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-indigo-500 transition">
            </div>

            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto justify-end">
                <div class="flex items-center gap-1.5">
                    <span class="text-[11px] text-slate-500 font-medium">Categoría:</span>
                    <select id="categoryFilter" onchange="filterPrompts()" class="bg-slate-50 border border-slate-300 rounded-md px-2 py-1 text-xs text-slate-800 focus:outline-none focus:border-indigo-500">
                        <option value="all">Todas</option>
                    </select>
                </div>

                <div class="flex items-center gap-1.5">
                    <span class="text-[11px] text-slate-500 font-medium">Ordenar:</span>
                    <select id="sortOrder" onchange="filterPrompts()" class="bg-slate-50 border border-slate-300 rounded-md px-2 py-1 text-xs text-slate-800 focus:outline-none focus:border-indigo-500">
                        <option value="recent">Recientes</option>
                        <option value="az">A - Z</option>
                        <option value="za">Z - A</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Barra de estado -->
        <div class="flex justify-between items-center mb-3 px-1 text-xs text-slate-500">
            <span id="promptCount">Mostrando prompts...</span>
            <button onclick="loadSamplePrompts()" class="text-indigo-600 hover:text-indigo-800 underline transition cursor-pointer">Cargar ejemplo</button>
        </div>

        <!-- Grid de Prompts -->
        <div id="promptsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Las tarjetas se generan dinámicamente -->
        </div>

        <!-- Estado vacío -->
        <div id="emptyState" class="hidden text-center py-16">
            <div class="inline-block bg-slate-200 p-4 rounded-full text-slate-400 mb-2 text-xl">
                <i class="fa-solid fa-folder-open"></i>
            </div>
            <p class="text-slate-500 text-xs">No se encontraron prompts guardados.</p>
        </div>
    </main>

    <!-- Modal de Seguridad (PIN: 3501) -->
    <div id="securityModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white border border-slate-300 rounded-xl w-full max-w-sm shadow-xl overflow-hidden">
            <div class="px-5 py-3 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-xs text-slate-800 flex items-center gap-1.5"><i class="fa-solid fa-lock text-rose-600"></i> Código de Seguridad (3501)</h3>
                <button onclick="closeSecurityModal()" class="text-slate-400 hover:text-slate-700 transition cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-5 space-y-3">
                <p id="securityMsg" class="text-xs text-slate-600">
                    Introduce el código clave de seguridad para autorizar la eliminación:
                </p>
                <div>
                    <input type="password" id="securityPin" placeholder="••••" maxlength="4"
                        class="w-full bg-slate-50 border border-slate-300 rounded-md px-3 py-2 text-center text-base tracking-widest text-slate-800 focus:outline-none focus:border-rose-500 font-mono">
                </div>
                <div class="flex justify-end gap-2 pt-1">
                    <button type="button" onclick="closeSecurityModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-md text-xs font-medium transition cursor-pointer">Cancelar</button>
                    <button type="button" onclick="confirmDeleteAction()" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-md text-xs font-medium transition shadow-sm cursor-pointer">Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Agregar / Editar Prompt -->
    <div id="promptModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white border border-slate-300 rounded-xl w-full max-w-md shadow-xl overflow-hidden">
            <div class="px-5 py-3 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <h3 id="modalTitle" class="font-bold text-sm text-slate-800">Nuevo Prompt</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 transition cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="promptForm" onsubmit="savePrompt(event)" class="p-5 space-y-3">
                <input type="hidden" id="promptId">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 mb-1">Título del Prompt</label>
                    <input type="text" id="formTitle" required placeholder="Ej: Analizador de código" 
                        class="w-full bg-slate-50 border border-slate-300 rounded-md px-3 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 mb-1">Categoría</label>
                    <input type="text" id="formCategory" required placeholder="Ej: Desarrollo, Productividad" list="categorySuggestions"
                        class="w-full bg-slate-50 border border-slate-300 rounded-md px-3 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-indigo-500">
                    <datalist id="categorySuggestions">
                        <!-- Opciones dinámicas -->
                    </datalist>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 mb-1">Contenido del Prompt</label>
                    <textarea id="formContent" required rows="5" placeholder="Instrucción detallada..."
                        class="w-full bg-slate-50 border border-slate-300 rounded-md p-2.5 text-xs text-slate-800 focus:outline-none focus:border-indigo-500 font-mono"></textarea>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-md text-xs font-medium transition cursor-pointer">Cancelar</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 rounded-md text-xs font-medium transition shadow-sm cursor-pointer">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal para Pegar Texto Masivo -->
    <div id="bulkModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-
